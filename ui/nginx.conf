server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location /api/ { proxy_pass http://ingestion:8080; proxy_buffering off; proxy_read_timeout 1h; }
  location /healthz { proxy_pass http://ingestion:8080; }
  location = /readyz { proxy_pass http://ingestion:8080; }
  location = /metrics { proxy_pass http://ingestion:8080; }
  # Agent installers and binaries for one-line enrollment (mounted read-only by Compose).
  location = /agent/install.sh { alias /srv/agent/scripts/install.sh; default_type text/plain; add_header Cache-Control no-store always; }
  location = /agent/install.ps1 { alias /srv/agent/scripts/install.ps1; default_type text/plain; add_header Cache-Control no-store always; }
  location /agent/ { alias /srv/agent/bin/; default_type application/octet-stream; add_header Cache-Control no-store always; }
  location / { try_files $uri /index.html; }
}

