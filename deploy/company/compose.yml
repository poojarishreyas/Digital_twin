# Merge from the repository root with docker-compose.yml. Compose 2.24.4+.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  neo4j:
    ports: !reset []
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  ingestion:
    ports: !override ["${TWIN_AGENT_BIND:?Set a private interface address}:8443:8443"]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    environment:
      TWIN_DEPLOYMENT_MODE: company
      TWIN_AUTH_MODE: tokens
      TWIN_COOKIE_SECURE: "true"
      TWIN_ALLOWED_ORIGINS: ${TWIN_PUBLIC_ORIGIN:?Set the HTTPS browser origin}
  ui:
    ports: !reset []
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  gateway:
    image: nginx:1.27-alpine
    ports: ["${TWIN_WEB_BIND:?Set a private interface address}:443:443"]
    volumes:
      - ./deploy/company/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ./secrets/tls
        target: /etc/twin-tls
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      ingestion: {condition: service_healthy}
      ui: {condition: service_started}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
