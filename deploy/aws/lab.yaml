AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Digital Twin demonstration lab (synthetic data only). Creates an isolated VPC with
  four Amazon Linux 2023 hosts: a control plane / sandbox worker and three "company"
  service hosts (web -> app/cache -> database). Every account, password and record is
  synthetic. This is a security-research lab, not a real company system.

Parameters:
  OperatorCidr:
    Type: String
    Description: Your public IP in CIDR form (e.g. 203.0.113.5/32) for SSH and dashboard access.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH access.
  LatestAl2023:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
  WorkerInstanceType:
    Type: String
    Default: m7i-flex.large
  ServiceInstanceType:
    Type: String
    Default: t3.small

Mappings:
  Net:
    vpc: {cidr: 10.20.0.0/16}
    public: {cidr: 10.20.1.0/24}   # twin-worker + web (reachable from the operator)
    private: {cidr: 10.20.2.0/24}  # app, cache, database (internal only)

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Net, vpc, cidr]
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: twin-lab}, {Key: twin-lab, Value: "true"}]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: twin-lab}]
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw}

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, public, cidr]
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{Key: Name, Value: twin-lab-public}]
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, private, cidr]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{Key: Name, Value: twin-lab-private}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc, Tags: [{Key: Name, Value: twin-lab-public}]}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw}
  PublicAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet}

  # NAT so private hosts can fetch packages and the agent installer, but stay unreachable inbound.
  NatEip:
    Type: AWS::EC2::EIP
    Properties: {Domain: vpc}
  Nat:
    Type: AWS::EC2::NatGateway
    Properties: {AllocationId: !GetAtt NatEip.AllocationId, SubnetId: !Ref PublicSubnet, Tags: [{Key: Name, Value: twin-lab}]}
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc, Tags: [{Key: Name, Value: twin-lab-private}]}
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref PrivateRouteTable, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat}
  PrivateAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnet}

  # --- Security groups -------------------------------------------------------
  WorkerSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: twin-worker control plane and sandbox
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref OperatorCidr, Description: SSH from operator}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref OperatorCidr, Description: Dashboard from operator}
      Tags: [{Key: Name, Value: twin-worker}]
  WorkerAgentIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSg
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      CidrIp: !FindInMap [Net, vpc, cidr]
      Description: Agent mTLS telemetry from lab hosts only

  WebSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dmz-web01 reverse proxy (entry asset)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref OperatorCidr, Description: SSH from operator}
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref OperatorCidr, Description: Lab web from operator}
      Tags: [{Key: Name, Value: dmz-web01}]

  InternalSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app01, cache01, db01 (internal services)
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: twin-lab-internal}]
  # Internal reachability that makes the attack path: web -> app -> db/cache.
  AppFromWeb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref InternalSg, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref WebSg, Description: app HTTP from web}
  SshFromWeb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref InternalSg, IpProtocol: tcp, FromPort: 2222, ToPort: 2222, SourceSecurityGroupId: !Ref WebSg, Description: lab SSH from web}
  DbFromInternal:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref InternalSg, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref InternalSg, Description: postgres within internal tier}
  CacheFromInternal:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref InternalSg, IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref InternalSg, Description: redis within internal tier}
  InternalSshFromWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref InternalSg, IpProtocol: tcp, FromPort: 22, ToPort: 22, SourceSecurityGroupId: !Ref WorkerSg, Description: OS SSH via worker bastion}

  TwinWorker:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref WorkerInstanceType
      ImageId: !Ref LatestAl2023
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WorkerSg]
      BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {VolumeSize: 40, VolumeType: gp3, DeleteOnTermination: true}}]
      Tags: [{Key: Name, Value: twin-worker}, {Key: twin-lab, Value: "true"}, {Key: role, Value: control-plane}]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf -y install docker git
          systemctl enable --now docker
          curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

  WebHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref ServiceInstanceType
      ImageId: !Ref LatestAl2023
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSg, !Ref InternalSg]
      Tags: [{Key: Name, Value: dmz-web01}, {Key: twin-lab, Value: "true"}, {Key: role, Value: web}]

  AppHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref ServiceInstanceType
      ImageId: !Ref LatestAl2023
      KeyName: !Ref KeyName
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds: [!Ref InternalSg]
      Tags: [{Key: Name, Value: app01}, {Key: twin-lab, Value: "true"}, {Key: role, Value: app}]

  DbHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref ServiceInstanceType
      ImageId: !Ref LatestAl2023
      KeyName: !Ref KeyName
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds: [!Ref InternalSg]
      Tags: [{Key: Name, Value: db01}, {Key: twin-lab, Value: "true"}, {Key: role, Value: database}]

  LabBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: twin-lab-monthly
        BudgetLimit: {Amount: "90", Unit: USD}
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 44}
          Subscribers: [{SubscriptionType: EMAIL, Address: "omkarshanbhag123@gmail.com"}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 88}
          Subscribers: [{SubscriptionType: EMAIL, Address: "omkarshanbhag123@gmail.com"}]

Outputs:
  WorkerPublicIp: {Value: !GetAtt TwinWorker.PublicIp, Description: SSH here; dashboard at https://<this-ip>}
  WebPublicIp: {Value: !GetAtt WebHost.PublicIp}
  WorkerPrivateIp: {Value: !GetAtt TwinWorker.PrivateIp, Description: Agents point at this:8443}
  WebPrivateIp: {Value: !GetAtt WebHost.PrivateIp}
  AppPrivateIp: {Value: !GetAtt AppHost.PrivateIp}
  DbPrivateIp: {Value: !GetAtt DbHost.PrivateIp}
